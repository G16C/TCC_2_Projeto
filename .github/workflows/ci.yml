
name: CI

# Executa os testes automaticamente a cada push e pull request.
# Publica os relatórios de testes e cobertura como artefatos.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Instalar dependência JADE
        run: >
          mvn --batch-mode --no-transfer-progress
          org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file
          -Dfile=lib/jade.jar
          -DgroupId=com.tilab.jade
          -DartifactId=jade
          -Dversion=4.6.0
          -Dpackaging=jar
          -DgeneratePom=true

      - name: Compilar e rodar os testes (com cobertura)
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Publicar relatório de testes (Surefire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Publicar relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura
          path: target/site/jacoco/
          if-no-files-found: ignore